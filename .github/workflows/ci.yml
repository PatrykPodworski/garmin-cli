name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run vulture
      - run: uv run deptry src
      - name: mutmut (score >= 80%)
        run: |
          uv run mutmut run
          uv run mutmut export-cicd-stats
          uv run python -c '
          import json, sys
          s = json.load(open("mutants/mutmut-cicd-stats.json"))
          score = 100 * s["killed"] / (s["killed"] + s["survived"] + s["timeout"] + s["suspicious"])
          print(f"mutation score {score:.1f}%")
          sys.exit(score < 80)
          '

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
