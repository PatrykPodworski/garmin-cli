[project]
name = "garmin-cli"
version = "0.1.0"
description = "Read Garmin Connect data from the terminal as JSON"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.17",
]

[project.scripts]
garmin = "garmin_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# garminconnect ships no py.typed marker.
module = ["garminconnect.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--cov --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90
